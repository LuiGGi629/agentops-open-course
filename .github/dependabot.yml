# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Dependabot keeps the repository's pin-everything policy current instead of pinned-and-forgotten.
# It is native to GitHub and needs no token, no app install, and no self-hosted workflow.
#
# Dependabot does not support globs in `directory`, so each Go module gets its
# own entry. The root module exists only to pin the Hextra Hugo theme.
#
# Nothing auto-merges. The offline gate cannot see model or protocol drift, so every update goes
# through the local validation playbook in docs 8.2. Releases.
#
# What Dependabot does NOT cover here, and is therefore updated by hand (see AGENTS.md "Pinned
# contracts" and the quarterly docs-freshness issue): the `[tools]` pins in mise.toml plus
# mise.lock, the Helm chart versions in infra/helmfile.yaml, the image digests inside
# infra/k8s/**, and the compatibility holds in agents/go/go.mod and tools/go.mod (ignored below).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  - package-ecosystem: gomod
    directory: /agents/go # the Go reference agent, its tests, and its go.mod tool directive
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    ignore:
      # ADK Go owns this family, and agents/go/go.mod records the ceiling as structured
      # `// compatibility hold: owner=google.golang.org/adk/v2@<version> constraint=<version>`
      # comments. check:freshness reports MISMATCH — and CI fails — unless the required
      # version still matches the recorded constraint AND the manifest still requires the
      # owner at its recorded version. Dependabot rewrites the require line but never the
      # hold comment, so every pull request it can open here is red by construction: one
      # module on its own breaks the constraint, and ADK on its own breaks the owner
      # version. `exclude-patterns` alone did not prevent this, because excluding a
      # dependency from a group makes Dependabot open a separate pull request for it
      # rather than none — which is how five permanently red ones accumulated.
      # These move by hand and together, prompted by the quarterly freshness report's
      # "Go module compatibility holds" table, and validated by `agents/go` check + test.
      - dependency-name: github.com/openai/openai-go/v3
      - dependency-name: go.opentelemetry.io/otel*
      - dependency-name: google.golang.org/adk/v2
      - dependency-name: google.golang.org/genai
    groups:
      go-agent-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          # The same four as the ignore list above, restated as the batch boundary: if a
          # hold is ever lifted, these still must not ride into the weekly batch unreviewed.
          - "github.com/openai/openai-go/v3"
          - "go.opentelemetry.io/otel*"
          - "google.golang.org/adk/v2"
          - "google.golang.org/genai"
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7

  - package-ecosystem: gomod
    directory: / # the Hextra theme, consumed as a Hugo Module through the root go.mod
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      hugo-theme:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7

  - package-ecosystem: gomod
    directory: /evals # standalone black-box evaluation harness
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      evaluation-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7

  - package-ecosystem: gomod
    directory: /tools # native authoring, browser, and release tooling
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    ignore:
      # Same mechanism as /agents/go above, one family down: chromedp owns cdproto, and
      # tools/go.mod records the ceiling as a structured
      # `// compatibility hold: owner=chromedp@<version> constraint=<pseudo-version suffix>`
      # comment. check:freshness reports MISMATCH — and CI fails — unless the pinned
      # cdproto pseudo-version still contains the recorded constraint AND chromedp itself
      # is still required at the recorded version. Dependabot rewrites the require line
      # but never the hold comment, so both single-module bumps it can open here are red
      # by construction: cdproto on its own breaks the constraint, chromedp on its own
      # breaks the owner version. They move by hand and together, prompted by the
      # quarterly freshness report's "Go module compatibility holds" table, and validated
      # by the real Chrome accessibility acceptance run the hold names as its validator.
      - dependency-name: github.com/chromedp/cdproto
      - dependency-name: github.com/chromedp/chromedp
    groups:
      repository-tool-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /agents/go # agent image build and distroless runtime stages
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    ignore:
      # The build stage's Go version is a coordinated pin: it must stay equal to the `go`
      # directive in agents/go/go.mod and to the `go` entry in the root mise.toml [tools].
      - dependency-name: golang
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    cooldown:
      default-days: 7
