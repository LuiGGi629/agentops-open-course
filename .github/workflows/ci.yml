# Run the same quality gates used by local hooks.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 5 * * 0" # weekly, before the Monday model-backed evaluation

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Preserve main evidence; only superseded pull-request runs are disposable.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          # The action's default `mise install` materializes every [tools] entry,
          # including the 740 MB Google Cloud CLI that no gate below invokes.
          # The install tasks pull exactly the two tiers CI needs.
          install: false

      - name: Restore uv download cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock', 'agents/python/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ runner.arch }}-

      # Both the module cache and the build cache: `go test -race ./...` recompiles the whole
      # dependency graph otherwise, which is the dominant cost of the Go half of `check`+`test`.
      - name: Restore Go module and build caches
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('agents/go/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-

      - name: Install project dependencies
        run: mise run install:validation

      - name: Verify the learner base doctor end to end
        run: mise run doctor

      - name: Format sources
        run: mise run format

      # The only network-permitted gate in the chain: `check` fans out to `check:vuln`, whose two
      # children audit the Python lock exports with pip-audit and the Go module with govulncheck.
      # The hooks run `check:core` instead, which omits both so an offline commit still succeeds.
      - name: Run static checks
        run: mise run check

      # Fans out to both reference agent suites (test:go, test:python).
      - name: Run offline tests
        run: mise run test

      - name: Smoke-test the account-free host path
        run: mise run smoke:host

      # Both suites already run inside `mise run test`; these dedicated steps make
      # a red-team or evalset regression a named merge-gate signal instead of one
      # line in the full run. Both are deterministic and offline — no model, no key.
      - name: Run the deterministic red-team suite
        run: cd agents/python && mise run redteam

      - name: Validate the evalset against the seed data
        run: cd agents/python && mise run eval:validate

      - name: Verify generated files are committed
        run: |
          changed="$(git status --porcelain)"
          if [ -n "$changed" ]; then
            echo "::error::Working tree is dirty after install/format/check/test — a generated file is not committed."
            echo "$changed"
            git diff --stat
            git diff
            exit 1
          fi

  critical-stability:
    name: Critical stability
    if: github.event_name == 'schedule' && github.repository == 'MLOps-Courses/agentops-open-course'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select the pinned tool manager
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: false

      - name: Install only the Python toolchain
        run: |
          mise install uv
          cd agents/python
          mise run install

      - name: Repeat critical offline regressions without retries
        run: cd agents/python && mise run test:critical
