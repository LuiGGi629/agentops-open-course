# Build and validate the local-only Hugo course documentation.
name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select the pinned tool manager
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: false

      - name: Restore Go module and build caches
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: docs-go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'tools/go.sum') }}

      - name: Install only the documentation toolchain
        run: |
          mise install -y --locked hugo-extended go golangci-lint dprint
          GOFLAGS=-mod=readonly go mod download
          cd tools
          mise run install

      - name: Validate and build the site
        run: mise run check:docs

  accessibility:
    name: Browser accessibility
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select the pinned tool manager
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: false

      - name: Restore documentation Go caches
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: docs-accessibility-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'tools/go.sum') }}

      - name: Install only the documentation and browser toolchains
        run: |
          mise install -y --locked hugo-extended go golangci-lint dprint
          GOFLAGS=-mod=readonly go mod download
          cd tools
          mise run install
          cd ..
          mise run install:accessibility

      - name: Run the browser accessibility acceptance
        run: mise run check:accessibility
