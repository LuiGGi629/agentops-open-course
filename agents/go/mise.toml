# https://mise.jdx.dev
# AgentOps reference agent — Go track tasks.
# The task vocabulary matches the Python track and the repository root, so
# learners, git hooks, and CI use the same words on either track.
# Only configuration/model-backed tasks load the root .env; offline gates load no dotenv.

[env]
APP_NAME = "agent"

[settings.task]
run_auto_install = false

[tasks.install]
alias = "i"
description = "Install development dependencies (module requirements and git hooks)"
depends = ["install:go"]

[tasks."install:go"]
description = "Tidy Go modules and download dependencies"
run = "go mod tidy"

[tasks.format]
alias = "f"
description = "Format Go sources and imports"
depends = ["format:go"]

[tasks."format:go"]
description = "Sort imports and format with goimports and gofumpt"
# Flags mirror .golangci.yml: local-prefixes and extra-rules are format policy,
# so without them `format` writes a style that `check` then rejects.
run = [
  "go tool goimports -local github.com/MLOps-Courses/agentops-open-course-go/agents/go -w .",
  "go tool gofumpt -extra -w .",
]

[tasks.check]
alias = "c"
description = "Run the offline code checks in parallel"
# check:vuln is deliberately absent: govulncheck queries the vulnerability
# database over the network, and this chain runs on every commit. An offline
# commit must not fail. CI runs check:vuln as its own step.
depends = ["check:format", "check:lint"]

[tasks."check:format"]
alias = "cf"
description = "Check Go formatting without writing"
run = "golangci-lint fmt --diff"

[tasks."check:lint"]
alias = "cl"
description = "Lint Go sources (golangci-lint)"
run = "golangci-lint run ./..."

[tasks."check:vuln"]
alias = "ca"
description = "Audit dependencies for known vulnerabilities (needs network; CI-only gate)"
run = "go tool govulncheck ./..."

[tasks."config:check"]
description = "Validate the resolved agent configuration and print it with secrets masked"
env = { _.file = { path = "../../.env", redact = true } }
run = "go run ./cmd/agent config:check"

[tasks.test]
alias = "t"
description = "Run the offline test suite with coverage"
run = "gotestsum --format pkgname -- -race -coverprofile=coverage.out ./..."

[tasks.coverage]
alias = "v"
description = "View test coverage in the terminal"
depends = ["test"]
run = "go tool cover -func=coverage.out"

[tasks.build]
alias = "b"
description = "Compile the production binary"
depends = ["build:go"]

[tasks."build:go"]
description = "Compile a static, cgo-free production binary"
sources = ["go.mod", "go.sum", "**/*.go"]
outputs = ["bin/{{env.APP_NAME}}"]
# CGO_ENABLED=0 is a course invariant (MIGRATE.md D-4), not an optimization:
# it is what lets the binary ship distroless and keeps one SQLite implementation.
env = { CGO_ENABLED = "0" }
run = "go build -o bin/$APP_NAME ./cmd/agent"

[tasks.watch]
alias = "w"
description = "Run the test suite in watch mode"
run = "gotestsum --watch --format pkgname -- ./..."

[tasks.run]
alias = "r"
description = "Run the agent in the terminal with the configured model"
# AGENT_ENTRYPOINT selects the composition the one binary serves, exactly as it
# does on the Python track: the three terminal tasks below differ only by it.
env = { AGENT_ENTRYPOINT = "agent", _.file = { path = "../../.env", redact = true } }
run = "go run ./cmd/agent console"

[tasks.workflow]
description = "Run the bounded read-only planning workflow in the terminal"
env = { AGENT_ENTRYPOINT = "workflow", _.file = { path = "../../.env", redact = true } }
run = "go run ./cmd/agent console"

[tasks.coordinator]
description = "Run the least-privilege multi-agent coordinator in the terminal"
env = { AGENT_ENTRYPOINT = "coordinator", _.file = { path = "../../.env", redact = true } }
run = "go run ./cmd/agent console"

[tasks.web]
description = "Run the ADK developer web UI with the configured model on :8002"
# Not ADK's default :8080: the A2A server owns that port in the stable network
# contract and the raw MCP server owns :8000, so both would collide whenever
# Chapter 3.3 or 3.6 is running. The two address flags are not decoration —
# the UI calls the REST API by the address it is given and the API allows CORS
# for the address it is given, and both default to :8080.
env = { AGENT_ENTRYPOINT = "agent", _.file = { path = "../../.env", redact = true } }
run = "go run ./cmd/agent web -port 8002 webui -api_server_address http://localhost:8002/api api -webui_address localhost:8002"

[tasks.a2a]
description = "Run the persistent A2A server on :8080"
env = { AGENT_ENTRYPOINT = "agent", _.file = { path = "../../.env", redact = true } }
run = "go run ./cmd/agent a2a"

[tasks.mcp]
description = "Run the AgentOps Agent MCP server over stdio (Ch. 3.3)"
# No dotenv, on either MCP task: this process builds no model and holds no
# credential — it reads the dataset and answers the six read tools.
run = "go run ./cmd/agent mcp"

[tasks."mcp:http"]
description = "Run the AgentOps Agent MCP server over streamable HTTP on :8000"
env = { MCP_HOST = "127.0.0.1", MCP_PORT = "8000", MCP_TRANSPORT = "streamable-http" }
run = "go run ./cmd/agent mcp"

[tasks.clean]
alias = "n"
description = "Remove caches and build artifacts"
run = "rm -rf bin/ coverage.out"

[tasks."data:reset"]
description = "Reset the disposable runtime database from the committed seed"
run = "rm -rf .state"
