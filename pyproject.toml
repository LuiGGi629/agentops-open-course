# https://docs.astral.sh/uv/reference/settings/
# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/
#
# This project holds the COURSE DOCUMENTATION gates only. The site is built by Hugo
# (see hugo.toml); the agent code lives in `agents/python`, a self-contained project.

[project]
name = "agentops-open-course"
version = "0.7.0"
description = "Build, evaluate, secure, deploy, and operate production AI agents with Google ADK and an open-source AgentOps stack."
authors = [{ name = "Médéric HURIER", email = "agentops-open-course@fmind.dev" }]
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
license-files = ["LICENSE"]
# The site itself is built by Hugo, a single static binary pinned in mise.toml. Python
# remains only for the documentation gates: scripts/check_conventions.py parses front
# matter, and scripts/accessibility_browser.py drives a real browser.
dependencies = []

[dependency-groups]
dev = [
  "pip-licenses==5.5.5",
  "pyyaml==6.0.3", # front matter validation in scripts/check_conventions.py
]

[tool.uv]
package = false
