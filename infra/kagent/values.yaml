rbac:
  namespaces:
    - kagent
    - agentops

controller:
  image:
    # The chart inserts ':' before tag, so tag@digest preserves the readable
    # version while making the multi-architecture registry index immutable.
    tag: "0.9.12@sha256:d1ea7b70bb8d97de9f0774d44b598971c944b3ab4e88294b0bb78e59d1a63c15"
  watchNamespaces:
    - agentops
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

ui:
  image:
    tag: "0.9.12@sha256:1d5ada8d7f65a6b9ad28232463f9fd670c4c20875baa1c8008aaa1f1f988382e"
  replicas: 0
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

database:
  postgres:
    bundled:
      image:
        tag: "18.3-alpine@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7"
      storage: 500Mi
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi

providers:
  default: openAI
  openAI:
    provider: OpenAI
    model: qwen3:4b-instruct
    apiKeySecretRef: agentgateway-client
    apiKeySecretKey: OPENAI_API_KEY
    apiKey: agentgateway
    config:
      baseUrl: http://agentgateway.agentops.svc.cluster.local:4000/v1

kmcp:
  enabled: false

kagent-tools:
  enabled: false

k8s-agent:
  enabled: false
kgateway-agent:
  enabled: false
istio-agent:
  enabled: false
promql-agent:
  enabled: false
observability-agent:
  enabled: false
argo-rollouts-agent:
  enabled: false
helm-agent:
  enabled: false
cilium-policy-agent:
  enabled: false
cilium-manager-agent:
  enabled: false
cilium-debug-agent:
  enabled: false

grafana-mcp:
  enabled: false
querydoc:
  enabled: false

otel:
  tracing:
    enabled: true
    exporter:
      otlp:
        endpoint: otel-collector.agentops.svc.cluster.local:4317
        protocol: grpc
        insecure: true
